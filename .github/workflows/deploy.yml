name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-koulivand
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SITE_URL: https://koulivand.ir
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build Next.js
        run: npm run build

      - name: Build image on modeno
        env:
          MODENO_HOST: ${{ secrets.MODENO_HOST }}
          MODENO_SSH_KEY: ${{ secrets.MODENO_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${MODENO_HOST}" || -z "${MODENO_SSH_KEY}" ]]; then
            echo "Repository secrets MODENO_HOST and MODENO_SSH_KEY are required." >&2
            exit 1
          fi
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${MODENO_SSH_KEY}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          ssh-keyscan -H "${MODENO_HOST}" >> "${HOME}/.ssh/known_hosts"
          SSH=(ssh -i "${HOME}/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          "${SSH[@]}" "root@${MODENO_HOST}" "rm -rf /opt/koulivand/src && mkdir -p /opt/koulivand/src"
          tar -czf - \
            --exclude node_modules \
            --exclude .next \
            --exclude out \
            --exclude .git \
            . | "${SSH[@]}" "root@${MODENO_HOST}" "tar -xzf - -C /opt/koulivand/src"
          "${SSH[@]}" "root@${MODENO_HOST}" "docker build --label org.opencontainers.image.revision=${GITHUB_SHA} -t koulivand/blog:${GITHUB_SHA} /opt/koulivand/src && docker tag koulivand/blog:${GITHUB_SHA} koulivand/blog:production && bash /opt/koulivand/src/deploy/deploy.sh"
