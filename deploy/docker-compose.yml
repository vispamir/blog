services:
  blog:
    image: nginx:alpine
    container_name: koulivand-blog
    restart: unless-stopped
    pull_policy: missing
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ofox

networks:
  ofox:
    external: true
    name: ofox
